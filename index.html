<template id="panel-profile">
<h2>木村 紀喜<small>きむら としき</small>
</h2>
<p>佐賀県唐津市出身。早稲田大学大学院教育学研究科 高度教職実践専攻にて学びながら、 2027年4月からの小学校教諭着任に向け、実践と研究を往還しています。</p>
<h3>子どもたちの「前向きに生きる力」を育てる</h3>
<p>子どもたちが自分のよさや関心に気付き、何かに打ち込めるよう支えたいと考えています。大学院での学びと学校での実践を、このサイトに記録しています。</p>
<div class="timeline">
<article>
<time>2025 - Present</time>
<h4>早稲田大学大学院 教育学研究科</h4>
<p>高度教職実践専攻。理論と実践の往還を中心に据えながら、授業開発と教育工学を探究。</p>
</article>
<article>
<time>2021 - 2025</time>
<h4>佐賀大学 教育学部</h4>
<p>教員免許取得に向けて学びを深めながら、地域の学校現場でのボランティア活動に従事。</p>
</article>
</div>
<a class="reader-link" href="profile.html">経歴・資格を詳しく読む <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
<path d="M7 17 17 7M7 7h10v10"/>
</svg>
</a>

<template id="panel-research">
<p>小学校教育を軸に、授業づくりと教育研究に取り組んでいます。</p>
<article class="research-item">
<span class="item-tag">総合・探究</span>
<h3>少人数ゼミで進める教科等横断的な探究学習</h3>
<p>小学校の総合的な学習の時間に、子どもの関心と各教科の学びを結び付け、少人数・異学年で自分の問いを追究する教育課程を構想。</p>
</article>
<article class="research-item">
<span class="item-tag">生成AI・UDL</span>
<h3>生成AIとUDLで支える自己調整学習</h3>
<p>学び方や表し方に選択肢を用意するUDL（学びのユニバーサルデザイン）に、生成AIを「問い返し相手」として活用。資料と照らし合わせ、学び方を自ら調整する授業を研究。</p>
</article>
<article class="research-item">
<span class="item-tag">社会科教育</span>
<h3>社会科の資質・能力を育てる授業づくり</h3>
<p>地域や社会の課題について資料を集め、確かめ、比べ、関連付ける。多様な立場を踏まえ、根拠をもとに判断し表現する学習を研究。</p>
</article>
<article class="research-item">
<span class="item-tag">学力向上</span>
<h3>確かな学力を育てる授業と評価</h3>
<p>知識・技能と思考力・判断力・表現力を結び付け、子どものつまずきや伸びに応じて指導と評価を改善。一人一人の学力向上につなげる方法を研究。</p>
</article>
<article class="research-item">
<span class="item-tag">道徳・AI倫理</span>
<h3>道徳科で育てる生成AI時代の倫理観</h3>
<p>AIの答えを資料と照らし合わせ、誤りや偏り、個人情報、著作権、他者への影響を手掛かりに、人が判断する責任を考える学習を構想。</p>
</article>
<article class="research-item">
<span class="item-tag">ふるさと教育・構想中</span>
<h3>唐津から考える「佐賀を誇りに思う」ふるさと教育</h3>
<p>唐津・佐賀の歴史、文化、自然、産業と地域の課題を教科等横断的に学び、自分なりの愛着や誇りを育てる独自のカリキュラムを構想中。</p>
</article>
